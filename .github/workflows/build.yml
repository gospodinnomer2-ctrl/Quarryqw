name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Download Fabric template
        run: |
          curl -fsSL -o template.zip https://github.com/FabricMC/fabric-example-mod/archive/refs/heads/1.21.4.zip
          unzip -q template.zip
          mv fabric-example-mod-1.21.4 template
          rm -rf template/src
          cp -r src template/src
          sed -i 's/^archives_base_name.*/archives_base_name = quarry-client/' template/gradle.properties

      - name: Build
        working-directory: template
        run: |
          chmod +x gradlew
          export JAVA_HOME="$JAVA_HOME_21_X64"
          ./gradlew build --no-daemon --console=plain || {
            echo "Java 21 failed, trying Java 25"
            export JAVA_HOME="$JAVA_HOME_25_X64"
            ./gradlew build --no-daemon --console=plain
          }

      - uses: actions/upload-artifact@v4
        with:
          name: quarry-client
          path: |
            template/build/libs/*.jar
            !template/build/libs/*-sources.jar
